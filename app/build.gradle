plugins { id 'com.android.application' }

android {
    namespace 'il.remote.samsung'
    compileSdk 34
    defaultConfig {
        applicationId 'il.remote.samsung'
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName '2.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "SamsungRemote-v${variant.versionName}.apk"
        }
    }
}
